// Cherche une configuration H.264 acceptée par ce navigateur.
async function pickVideoConfig(width, height, fps, bitrate) {
  const codecs = ["avc1.64002A", "avc1.4D002A", "avc1.42002A", "avc1.640028", "avc1.4D0028"];

  for (const codec of codecs) {
    const config = {
      codec,
      width,
      height,
      bitrate,
      framerate: fps,
      avc: { format: "avc" },
      latencyMode: "quality"
    };

    try {
      const result = await VideoEncoder.isConfigSupported(config);

      if (result && result.supported) return config;
    } catch (error) {
      // on essaie la suite
    }
  }

  return null;
}

// Fabrique la musique avec les passages "clair / étouffé" de l'export,
// sans passer par les haut-parleurs (calcul instantané).
async function renderMusicOffline(totalSeconds, fadeStart, events, sampleRate) {
  const length = Math.ceil((totalSeconds + 0.1) * sampleRate);
  const offline = new OfflineAudioContext(2, length, sampleRate);

  const source = offline.createBufferSource();
  source.buffer = musicBuffer;
  source.loop = cfg.musicLoop;

  const filters = [offline.createBiquadFilter(), offline.createBiquadFilter()];

  for (const filter of filters) {
    filter.type = "lowpass";
    filter.Q.value = 0.7;
  }

  const gain = offline.createGain();

  source.connect(filters[0]);
  filters[0].connect(filters[1]);
  filters[1].connect(gain);
  gain.connect(offline.destination);

  const baseVolume = cfg.musicVolume / 100;
  const mutedVolume = cfg.muffleVolume / 100;

  // Même logique que applyMusicState (démarre étouffé).
  filters.forEach(filter => filter.frequency.setValueAtTime(cfg.muffleFreq, 0));
  gain.gain.setValueAtTime(baseVolume * mutedVolume, 0);

  for (const [time, clear] of events) {
    const freq = clear ? CLEAR_FREQ : cfg.muffleFreq;
    const volume = baseVolume * (clear ? 1 : mutedVolume);
    const timeConstant = clear ? 0.04 : 0.07;

    filters.forEach(filter => filter.frequency.setTargetAtTime(freq, time, timeConstant));
    gain.gain.setTargetAtTime(volume, time, timeConstant);
  }

  // Fondu de fin, comme à l'écoute normale.
  gain.gain.setTargetAtTime(0, fadeStart, 0.1);

  const offset = clamp(cfg.musicOffset, 0, Math.max(0, musicBuffer.duration - 0.1));
  source.start(0, offset);

  const rendered = await offline.startRendering();

  // Réglage "Décalage du son dans la vidéo" : appliqué ici avec exactitude.
  const shiftFrames = Math.round(cfg.avOffset / 1000 * sampleRate);
  const left = rendered.getChannelData(0);
  const right = rendered.numberOfChannels > 1 ? rendered.getChannelData(1) : left;

  if (shiftFrames === 0) return { left, right };

  const outLength = rendered.length;
  const outLeft = new Float32Array(outLength);
  const outRight = new Float32Array(outLength);

  for (let i = 0; i < outLength; i++) {
    const from = i - shiftFrames;

    if (from >= 0 && from < outLength) {
      outLeft[i] = left[from];
      outRight[i] = right[from];
    }
  }

  return { left: outLeft, right: outRight };
}

// Encode la musique en AAC. Retourne null si le navigateur ne sait pas.
async function encodeMusicAAC(totalSeconds, fadeStart, events) {
  if (!window.AudioEncoder || !window.AudioData || !window.OfflineAudioContext) {
    return null;
  }

  const sampleRate = 48000;

  const config = {
    codec: "mp4a.40.2",
    sampleRate,
    numberOfChannels: 2,
    bitrate: 160000,
    aac: { format: "aac" }
  };

  let support = null;

  try {
    support = await AudioEncoder.isConfigSupported(config);
  } catch (error) {
    return null;
  }

  if (!support || !support.supported) return null;

  const pcm = await renderMusicOffline(totalSeconds, fadeStart, events, sampleRate);

  const samples = [];
  let asc = null;
  let failure = null;

  const encoder = new AudioEncoder({
    output: (chunk, meta) => {
      const data = new Uint8Array(chunk.byteLength);
      chunk.copyTo(data);
      samples.push(data);
    },
    error: error => { failure = error; }
  });

  encoder.configure(config);

  const block = 4096;
  const total = pcm.left.length;

  for (let start = 0; start < total; start += block) {
    const count = Math.min(block, total - start);
    const planar = new Float32Array(count * 2);

    planar.set(pcm.left.subarray(start, start + count), 0);
    planar.set(pcm.right.subarray(start, start + count), count);

    const data = new AudioData({
      format: "f32-planar",
      sampleRate,
      numberOfFrames: count,
      numberOfChannels: 2,
      timestamp: Math.round(start * 1e6 / sampleRate),
      data: planar
    });

    encoder.encode(data);
    data.close();

    if (failure) throw failure;

    while (encoder.encodeQueueSize > 16) await sleep(1);
  }

  await encoder.flush();
  encoder.close();

  if (failure) throw failure;

  // Configuration AAC fabriquée ici (AAC-LC, 48 kHz, stéréo = octets 11 90).
  // On n'utilise pas celle du navigateur : elle est au format esds et casse la lecture.
  asc = new Uint8Array(mp4AudioSpecificConfig(sampleRate, 2));

  return { samples, sampleRate, channels: 2, asc };
}

function setUILocked(locked) {
  if (!document.querySelectorAll) return;

  document.querySelectorAll("input, select, button").forEach(element => {
    if (element.id !== "exportBtn") element.disabled = locked;
  });
}

async function exportVideo() {
  // Deuxième clic pendant un export : annulation.
  if (exporting) {
    exportCancel = true;
    return;
  }

  if (recording) {
    updateStatus("Arrête d'abord l'enregistrement direct");
    return;
  }

  if (!webCodecsSupported()) {
    updateStatus("Export MP4 non pris en charge ici : utilise « Enreg. direct »");
    return;
  }

  const button = document.getElementById("exportBtn");
  const buttonLabel = button.textContent;

  exporting = true;
  exportCancel = false;

  button.textContent = "Annuler l'export";
  setUILocked(true);

  // On arrête tout ce qui tourne et on repart de zéro, en gardant la
  // disposition des trous actuellement affichée.
  cancelAnimationFrame(animationFrame);
  stopMusic();

  exportMode = true;
  exportEvents = [];

  // Même point de départ que l'aperçu (vitesse de la balle, disposition).
  const startState = departure ? { ...departure } : null;

  resetSimulation(true);

  if (startState) {
    ball.x = startState.x;
    ball.y = startState.y;
    ball.vx = startState.vx;
    ball.vy = startState.vy;
  }

  setRenderScale(previewScale);
  keepAwake(true);

  let encoder = null;

  try {
    const fps = Number(document.getElementById("fps").value) === 60 ? 60 : 30;
    const width = canvas.width;
    const height = canvas.height;

    const bitrate = Math.round(
      10e6 * (width * height) / (1080 * 1920) * (fps === 60 ? 1.6 : 1)
    );

    const videoConfig = await pickVideoConfig(width, height, fps, Math.max(3e6, bitrate));

    if (!videoConfig) {
      throw new Error("Ce navigateur ne sait pas encoder en H.264 à cette taille");
    }

    const samples = [];
    let avcC = null;
    let colorSpace = null;
    let failure = null;
    let lastTimestamp = -1;

    encoder = new VideoEncoder({
      output: (chunk, meta) => {
        if (chunk.timestamp <= lastTimestamp) {
          failure = new Error("Cet encodeur réordonne les images (non pris en charge)");
        }

        lastTimestamp = chunk.timestamp;

        const data = new Uint8Array(chunk.byteLength);
        chunk.copyTo(data);

        samples.push({ data, key: chunk.type === "key", ts: chunk.timestamp });

        if (meta && meta.decoderConfig) {
          if (!avcC && meta.decoderConfig.description) {
            avcC = toUint8(meta.decoderConfig.description);
          }

          if (meta.decoderConfig.colorSpace) {
            colorSpace = meta.decoderConfig.colorSpace;
          }
        }
      },
      error: error => { failure = error; }
    });

    encoder.configure(videoConfig);

    const frameTime = 1 / fps;
    const stepsPerFrame = Math.round(frameTime / SIM_DT);
    const holdFrames = Math.round(fps * 0.6);   // image finale + fondu du son
    const maxFrames = Math.ceil((cfg.duration + 2) * fps);

    let frameIndex = 0;
    let holdCount = 0;
    let animationEnd = null;

    while (frameIndex < maxFrames) {
      if (exportCancel) throw new Error("Export annulé");
      if (failure) throw failure;

      if (!finished) {
        for (let s = 0; s < stepsPerFrame && !finished; s++) {
          simStep(SIM_DT);

          if (elapsed >= cfg.duration) finishSimulation();
        }

        updateZoomSpring(frameTime);
        updateEffects(frameTime);

        if (finished) animationEnd = elapsed;
      } else {
        holdCount++;
      }

      draw();

      const frame = new VideoFrame(canvas, {
        timestamp: Math.round(frameIndex * 1e6 / fps),
        duration: Math.round(1e6 / fps)
      });

      while (encoder.encodeQueueSize > 8) await sleep(2);

      encoder.encode(frame, { keyFrame: frameIndex % (fps * 2) === 0 });
      frame.close();

      frameIndex++;

      if (finished && holdCount >= holdFrames) break;

      if (frameIndex % 6 === 0) {
        const percent = Math.min(
          99,
          Math.round(100 * Math.max(level / cfg.count, elapsed / cfg.duration))
        );

        updateStatus("Export en cours… " + percent + " % (garde cet onglet ouvert)");

        await sleep(0);   // laisse le navigateur rafraîchir l'écran
      }
    }

    await encoder.flush();
    encoder.close();
    encoder = null;

    if (failure) throw failure;
    if (!avcC) throw new Error("Encodage vidéo incomplet");

    // ---- son ----
    let audio = null;
    let audioNote = "";

    if (musicBuffer) {
      updateStatus("Export : préparation du son…");

      const totalSeconds = frameIndex / fps;

      audio = await encodeMusicAAC(
        totalSeconds,
        animationEnd === null ? totalSeconds : animationEnd,
        exportEvents
      );

      if (!audio) audioNote = " (son non pris en charge ici : vidéo sans musique)";
    }

    updateStatus("Export : assemblage du fichier…");
    await sleep(0);

    const mp4 = buildMP4({ width, height, fps, video: samples, avcC, colorSpace, audio });
    const blob = new Blob(mp4.parts, { type: "video/mp4" });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "ring-animation.mp4";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 5000);

    if (typeof File === "function") {
      lastVideoFile = new File([blob], "ring-animation.mp4", { type: "video/mp4" });
      updateShareButton();
    }

    const megabytes = (mp4.size / 1048576).toFixed(1);

    updateStatus(
      "Export terminé : MP4 " + fps + " images/s, " + megabytes + " Mo" + audioNote
    );
  } catch (error) {
    if (encoder) {
      try { encoder.close(); } catch (closeError) { /* déjà fermé */ }
    }

    updateStatus(
      error && error.message === "Export annulé"
        ? "Export annulé"
        : "Échec de l'export : " + (error && error.message ? error.message : error)
    );
  } finally {
    exportMode = false;
    exporting = false;
    exportCancel = false;

    button.textContent = buttonLabel;
    setUILocked(false);

    const status = document.getElementById("status").textContent;

    resetSimulation(true);
    keepAwake(false);

    updateStatus(status);
  }
}

// ======================================
// INTERFACE
// ======================================

// Garde l'écran allumé pendant l'animation (important sur téléphone :
// si l'écran s'éteint, l'animation et l'enregistrement s'arrêtent).
let wakeLock = null;

async function keepAwake(on) {
  try {
    if (on) {
      if (navigator.wakeLock && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } else if (wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  } catch (error) {
    wakeLock = null;
  }
}

if (typeof document.addEventListener === "function") {
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && recording) {
      abortRecording("Enregistrement arrêté : l'appli a été mise en arrière-plan");
      return;
    }

    if (document.visibilityState === "visible" && running && !paused) {
      keepAwake(true);
    }
  });
}

// Bouton "Partager" : sur téléphone, ouvre le menu de partage (enregistrer
// dans la galerie, TikTok, etc.) quand le navigateur le permet.
let lastVideoFile = null;

function updateShareButton() {
  const button = document.getElementById("shareBtn");

  if (!button) return;

  button.hidden = !(
    lastVideoFile &&
    navigator.canShare &&
    navigator.canShare({ files: [lastVideoFile] })
  );
}

document.getElementById("shareBtn").addEventListener("click", () => {
  if (!lastVideoFile || !navigator.share) return;

  navigator
    .share({ files: [lastVideoFile], title: "Animation" })
    .catch(() => {});
});

function updateStatus(message) {
  document.getElementById("status").textContent = message;
}

function updateCounter() {
  const remaining = Math.max(0, cfg.count - level);

  document.getElementById("counter").textContent =
    remaining + " cercles restants";
}

function bindRange(id, key, displayId, formatter = v => v) {
  const input = document.getElementById(id);
  const display = document.getElementById(displayId);

  input.addEventListener("input", () => {
    cfg[key] = Number(input.value);

    if (display) {
      display.textContent = formatter(cfg[key]);
    }

    if (key === "count") {
      cfg.count = Math.max(1, cfg.count);
      generateRingOffsets();
      level = Math.min(level, cfg.count - 1);
      updateCounter();
    }

    if (key === "ballSize") {
      ball.r = cfg.ballSize;
    }

    draw();
  });
}

bindRange("count", "count", "countValue");
bindRange("ballSize", "ballSize", "ballSizeValue");
bindRange("speed", "speed", "speedValue");
bindRange("groupMin", "groupMin", "groupMinValue");
bindRange("groupMax", "groupMax", "groupMaxValue");
bindRange("centerRadius", "centerRadius", "centerRadiusValue");
bindRange("drift", "drift", "driftValue", v => v + "°");
bindRange("jitter", "jitter", "jitterValue", v => v + "°");
bindRange("gap", "gap", "gapValue", v => v + "°");
bindRange("spacing", "spacing", "spacingValue");
bindRange("stroke", "stroke", "strokeValue");
bindRange("rotation", "rotation", "rotationValue", v => v + "°/s");
bindRange("offset", "offset", "offsetValue", v => v + "°");
bindRange("zoom", "zoom", "zoomValue", v => Number(v).toFixed(2));
bindRange("duration", "duration", "durationValue");

// Paquets : garde min <= max puis régénère les angles.
["groupMin", "groupMax"].forEach(id => {
  document.getElementById(id).addEventListener("input", () => {
    if (cfg.groupMin > cfg.groupMax) {
      if (id === "groupMin") {
        cfg.groupMax = cfg.groupMin;
        document.getElementById("groupMax").value = cfg.groupMax;
        document.getElementById("groupMaxValue").textContent = cfg.groupMax;
      } else {
        cfg.groupMin = cfg.groupMax;
        document.getElementById("groupMin").value = cfg.groupMin;
        document.getElementById("groupMinValue").textContent = cfg.groupMin;
      }
    }

    generateRingOffsets();
    draw();
  });
});

bindRange("musicVolume", "musicVolume", "musicVolumeValue", v => v + "%");
bindRange("muffleVolume", "muffleVolume", "muffleVolumeValue", v => v + "%");
bindRange("muffleFreq", "muffleFreq", "muffleFreqValue", v => v + " Hz");
bindRange("avOffset", "avOffset", "avOffsetValue", v => v + " ms");

document.getElementById("avOffset").addEventListener("input", () => {
  applyRecordDelay();
});

["musicVolume", "muffleVolume", "muffleFreq"].forEach(id => {
  document.getElementById(id).addEventListener("input", () => {
    applyMusicState(false);
  });
});

document.getElementById("musicOffset").addEventListener("input", e => {
  cfg.musicOffset = Math.max(0, Number(e.target.value) || 0);
});

document.getElementById("musicLoop").addEventListener("change", e => {
  cfg.musicLoop = e.target.checked;
});

document.getElementById("musicFile").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0];

  if (!file) return;

  // Le clic sur le fichier est un geste utilisateur : on peut créer l'audio.
  if (!ensureAudio()) {
    setMusicStatus("Audio non pris en charge par ce navigateur");
    return;
  }

  setMusicStatus("Chargement…");

  try {
    const data = await file.arrayBuffer();
    musicBuffer = await audioCtx.decodeAudioData(data);

    const minutes = Math.floor(musicBuffer.duration / 60);
    const seconds = Math.round(musicBuffer.duration % 60);

    setMusicStatus(
      file.name + " (" + minutes + ":" + String(seconds).padStart(2, "0") + ")"
    );
  } catch (error) {
    musicBuffer = null;
    setMusicStatus("Impossible de lire ce fichier audio");
  }
});

document.getElementById("effects").addEventListener("change", e => {
  cfg.effects = e.target.checked;
  trailCount = 0;
  spLife.fill(0);
  draw();
});

// Nouvelle disposition aléatoire : trous, paquets, sens de rotation,
// direction de la balle et étoiles. Les réglages ne changent pas, et
// l'animation continue là où elle en est (si elle est terminée, elle
// repart de zéro avec une disposition neuve).
function shuffleLayout() {
  if (finished) {
    resetSimulation();
    return;
  }

  generateRingOffsets();
  generateStars();

  const direction = random(0, TAU);
  const speed = Math.hypot(ball.vx, ball.vy) || cfg.speed;

  ball.vx = Math.cos(direction) * speed;
  ball.vy = Math.sin(direction) * speed;

  if (!running) {
    departure = { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy };
  }

  if (!running) updateStatus("Nouvelle disposition générée");

  draw();
}

document.getElementById("shuffleBtn").addEventListener("click", shuffleLayout);

// Téléphone : une seule rubrique visible, choisie par un onglet en haut
// de la zone de réglages. Grand écran : tout reste affiché, sans onglets.
if (window.matchMedia && document.querySelectorAll) {
  const mobileQuery = window.matchMedia("(max-width: 1050px)");
  const sections = Array.from(document.querySelectorAll(".side details"));
  const tabBar = document.getElementById("tabs");
  const panels = document.querySelector(".panels");
  const tabButtons = [];
  let activeIndex = 0;

  const showSection = index => {
    activeIndex = index;

    sections.forEach((section, i) => {
      section.classList.toggle("active", i === index);
    });

    tabButtons.forEach((button, i) => {
      button.classList.toggle("active", i === index);
      button.setAttribute("aria-pressed", String(i === index));
    });

    panels.scrollTop = 0;
  };

  sections.forEach((section, index) => {
    const label = section.querySelector("summary").textContent.replace(/\s+/g, " ").trim();
    const button = document.createElement("button");

    button.type = "button";
    button.className = "tab";
    button.textContent = label;
    button.addEventListener("click", () => showSection(index));

    tabBar.appendChild(button);
    tabButtons.push(button);
  });

  const applyPanelMode = () => {
    sections.forEach(section => {
      section.open = true;
    });

    showSection(activeIndex);
  };

  if (mobileQuery.addEventListener) {
    mobileQuery.addEventListener("change", applyPanelMode);
  }

  applyPanelMode();
}

document.getElementById("useGPU").addEventListener("change", e => {
  cfg.useGPU = e.target.checked;
  draw();
});

document.getElementById("quality").addEventListener("change", e => {
  previewScale = Number(e.target.value);

  // Pendant un enregistrement la résolution ne doit pas changer.
  if (!recording) setRenderScale(previewScale);
});

document.getElementById("directionMode").addEventListener("change", e => {
  cfg.directionMode = e.target.value;
  generateRingDirections();
  draw();
});

// ======================================
// COULEURS HEX
// ======================================

function bindColor(colorId, hexId, key) {
  const colorInput = document.getElementById(colorId);
  const hexInput = document.getElementById(hexId);

  colorInput.addEventListener("input", () => {
    cfg[key] = colorInput.value;
    hexInput.value = colorInput.value;
    draw();
  });

  hexInput.addEventListener("change", () => {
    const value = hexInput.value.trim();

    if (/^#[0-9a-fA-F]{6}$/.test(value)) {
      cfg[key] = value;
      colorInput.value = value;
      draw();
    } else {
      hexInput.value = cfg[key];
    }
  });
}

bindColor("bgColor", "bgHex", "bgColor");
bindColor("ringColor", "ringHex", "ringColor");
bindColor("activeColor", "activeHex", "activeColor");
bindColor("ballColor", "ballHex", "ballColor");
bindColor("glowColor", "glowHex", "glowColor");
bindColor("gradNear", "gradNearHex", "gradNear");
bindColor("gradMid", "gradMidHex", "gradMid");
bindColor("gradFar", "gradFarHex", "gradFar");

document.getElementById("colorMode").addEventListener("change", e => {
  cfg.colorMode = e.target.value;
  draw();
});

// ======================================
// BOUTONS
// ======================================

document.getElementById("startBtn").addEventListener(
  "click",
  startSimulation
);

document.getElementById("pauseBtn").addEventListener(
  "click",
  pauseSimulation
);

document.getElementById("resetBtn").addEventListener(
  "click",
  resetSimulation
);

document.getElementById("recordBtn").addEventListener(
  "click",
  startRecording
);

document.getElementById("exportBtn").addEventListener("click", exportVideo);

// Navigateur sans WebCodecs : on garde seulement l'enregistrement direct.
if (!webCodecsSupported()) {
  document.getElementById("exportBtn").hidden = true;
  document.getElementById("fpsLabel").hidden = true;
  document.getElementById("recordBtn").textContent = "Enregistrer";
  document.getElementById("recordBtn").title = "Enregistre en temps réel";
}

// ======================================
// INITIALISATION
// ======================================

generateStars();
setRenderScale(previewScale);
resetSimulation();

// ======================================
// SAUVEGARDE AUTOMATIQUE DES RÉGLAGES
// ======================================
// Les réglages (curseurs, couleurs, options) sont mémorisés dans le
// navigateur à chaque changement et retrouvés à la prochaine ouverture.
// Le fichier audio et l'animation ne sont pas sauvegardés.

const SAVE_KEY = "ringBounce.settings.v1";
const saveStatus = document.getElementById("saveStatus");
let saveTimer = null;

function settingsControls() {
  return Array.from(document.querySelectorAll("input[id], select[id]"))
    .filter(el => el.type !== "file");
}

function setSaveStatus(text) {
  if (saveStatus) saveStatus.textContent = text;
}

function saveSettings() {
  const data = {};

  for (const el of settingsControls()) {
    data[el.id] = el.type === "checkbox" ? el.checked : el.value;
  }

  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    setSaveStatus("Réglages sauvegardés automatiquement");
  } catch (error) {
    setSaveStatus("Sauvegarde impossible dans ce navigateur");
  }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveSettings, 300);
}

function restoreSettings() {
  let data = null;

  try {
    data = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
  } catch (error) {
    data = null;
  }

  if (!data || typeof data !== "object") return false;

  const controls = settingsControls().filter(el => el.id in data);

  for (const el of controls) {
    if (el.type === "checkbox") el.checked = Boolean(data[el.id]);
    else el.value = data[el.id];
  }

  // Prévient le reste de l'application (même chemin que la saisie manuelle).
  for (const el of controls) {
    el.dispatchEvent(new Event("input"));
    el.dispatchEvent(new Event("change"));
  }

  return true;
}

document.addEventListener("input", scheduleSave);
document.addEventListener("change", scheduleSave);

document.getElementById("resetSettingsBtn").addEventListener("click", () => {
  if (!confirm("Effacer les réglages sauvegardés et revenir aux valeurs de départ ?")) return;

  try {
    localStorage.removeItem(SAVE_KEY);
  } catch (error) {
    // Rien à effacer si le stockage est indisponible.
  }

  location.reload();
});

if (restoreSettings()) {
  setSaveStatus("Réglages restaurés depuis la dernière session");
}
